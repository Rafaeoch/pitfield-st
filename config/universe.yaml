# The universe, point-in-time.
#
# `added_date` makes the universe itself reconstructable to any past date. A
# ticker is NEVER removed from this file — when it stops trading or leaves the
# liquid set it gets a `retired_date` and stays. Deleting entries creates
# survivorship bias in every downstream study, and it is invisible once done.

version: 1

underlyings:
  # Index and sector ETFs
  - {ticker: SPY, added_date: 2026-09-02, note: "primary reference"}
  - {ticker: QQQ, added_date: 2026-09-02}
  - {ticker: IWM, added_date: 2026-09-02}
  - {ticker: DIA, added_date: 2026-09-02}
  - {ticker: VIX, added_date: 2026-09-02, note: "index, not an ETF; different settlement"}

