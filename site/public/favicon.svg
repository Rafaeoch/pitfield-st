  <g fill="none" stroke="#f0a860" stroke-linecap="round">
    <path d="M4,13.2 C9,18.4 23,18.4 28,13.2" stroke-width="2.4" opacity="1"/>
    <path d="M4,9.6 C9,14.2 23,14.2 28,9.6" stroke-width="1.9" opacity="0.62"/>
    <path d="M4,6.4 C9,10.4 23,10.4 28,6.4" stroke-width="1.5" opacity="0.34"/>
  </g>
</svg>
